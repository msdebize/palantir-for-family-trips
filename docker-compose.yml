services:
  palantir-trips:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
        VITE_OSRM_BASE: ${VITE_OSRM_BASE:-}
    image: palantir-trips:plim
    container_name: palantir-trips
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
